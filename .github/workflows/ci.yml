name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by @retrace/core's store) requires Node >= 22.5.
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Packs both packages as `pnpm publish` would and smoke-tests the packed
      # artifact end to end (tarball contents, a real `npm install` from the
      # tarball files, the installed binary against a throwaway store) — the
      # Windows leg is the one most likely to catch a path bug in
      # copy-viewer-dist.mjs. `pnpm build` already ran above, so skip its own.
      - run: pnpm verify:pack -- --skip-build
