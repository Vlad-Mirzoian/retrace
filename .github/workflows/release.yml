name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance (OIDC token exchange with the registry).
  id-token: write

jobs:
  release:
    # Tags can only be pushed by someone with write access to this repo, but
    # this guard makes it explicit: this job must never run from a fork.
    if: github.repository == 'Vlad-Mirzoian/retrace'
    runs-on: ubuntu-latest
    # Configure this environment in repo settings (Settings → Environments)
    # with required reviewers to gate publishing behind manual approval.
    # Referencing it here is harmless even if it isn't configured yet — with
    # no protection rules set up, the job just runs without pausing.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify:pack -- --skip-build

      - name: Pack both packages for publishing
        run: |
          mkdir -p /tmp/release-tarballs
          pnpm --filter retrace-core pack --pack-destination /tmp/release-tarballs
          pnpm --filter retrace-cli pack --pack-destination /tmp/release-tarballs

      - name: Publish retrace-core
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if npm view "retrace-core@$version" version >/dev/null 2>&1; then
            echo "retrace-core@$version is already on the registry — skipping (safe re-run)."
          else
            npm publish /tmp/release-tarballs/retrace-core-*.tgz --access public --provenance
          fi

      - name: Publish retrace-cli
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "retrace-cli@$version" version >/dev/null 2>&1; then
            echo "retrace-cli@$version is already on the registry — skipping (safe re-run)."
          else
            npm publish /tmp/release-tarballs/retrace-cli-*.tgz --access public --provenance
          fi
